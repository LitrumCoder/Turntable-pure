<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Vinyl</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="stage" id="stage">
    <div class="deck skin-pioneer empty" id="deck">
      <div class="ground"></div>
      <i class="foot"></i><i class="foot"></i><i class="foot"></i><i class="foot"></i>
      <div class="face face-back"></div>
      <div class="face face-left"></div>
      <div class="face face-right"></div>
      <div class="face face-front">
        <div class="front-caption" id="front-caption">тишина</div>
        <div class="front-controls">
          <button data-action="prev" title="Предыдущий">
            <svg viewBox="0 0 10 10"><path d="M1.6 1.5h1.3v7H1.6zM8.6 1.5v7L3.2 5z" /></svg>
          </button>
          <button data-action="play" class="play" title="Играть / пауза">
            <svg class="icon-play" viewBox="0 0 10 10"><path d="M2.8 1.2v7.6L8.8 5z" /></svg>
            <svg class="icon-pause" viewBox="0 0 10 10"><path d="M2.2 1.6h2v6.8h-2zM5.8 1.6h2v6.8h-2z" /></svg>
          </button>
          <button data-action="next" title="Следующий">
            <svg viewBox="0 0 10 10"><path d="M7.1 1.5h1.3v7H7.1zM1.4 1.5v7L6.8 5z" /></svg>
          </button>
        </div>
      </div>
      <div class="plate"></div>
      <div class="strip"></div>
      <div class="platter">
        <div class="mat">
          <svg class="mat-ring" viewBox="-50 -50 100 100">
            <defs>
              <path id="ring-path" d="M 0,-13.7 a 13.7,13.7 0 1,1 0,27.4 a 13.7,13.7 0 1,1 0,-27.4" />
            </defs>
            <circle r="14.6" />
            <text>
              <textPath href="#ring-path" textLength="85" lengthAdjust="spacing">
                VINYL ELECTRONIC · DIRECT DRIVE SERVO MOTOR ·
              </textPath>
            </text>
          </svg>
        </div>
        <div class="slot" id="slot">
          <div class="record" id="record">
            <div class="label blank" id="label"></div>
          </div>
        </div>
        <div class="sheen"></div>
        <div class="spindle"></div>
      </div>

      <div class="panel">
        <i class="screw"></i><i class="screw"></i><i class="screw"></i><i class="screw"></i>
        <div class="nameplate">
          <div class="brand">VINYL</div>
          <div class="caption idle" id="caption">
            <div class="line line-title"><span id="title">тишина</span></div>
            <div class="line line-artist"><span id="artist"></span></div>
            <div class="line line-combined"><span id="combined">тишина</span></div>
          </div>
        </div>
        <div class="controls">
          <div class="key">
            <button id="prev" data-action="prev" title="Предыдущий">
              <svg viewBox="0 0 10 10"><path d="M1.6 1.5h1.3v7H1.6zM8.6 1.5v7L3.2 5z" /></svg>
            </button>
            <span>PREV</span>
          </div>
          <div class="key">
            <button id="play" data-action="play" class="play" title="Играть / пауза">
              <svg class="icon-play" viewBox="0 0 10 10"><path d="M2.8 1.2v7.6L8.8 5z" /></svg>
              <svg class="icon-pause" viewBox="0 0 10 10"><path d="M2.2 1.6h2v6.8h-2zM5.8 1.6h2v6.8h-2z" /></svg>
              <svg class="dial" viewBox="-20 -20 40 40">
                <circle class="dial-ring" r="19" />
                <circle class="dial-cap" r="10.5" />
                <rect class="dial-mark" x="-0.8" y="4" width="1.6" height="5.5" rx="0.8" />
                <text y="-12">78</text>
                <text x="14.5" y="2">16</text>
                <text class="red" y="16">33</text>
                <text class="red" x="-14.5" y="2">45</text>
              </svg>
            </button>
            <span class="start"><em class="when-stopped">START</em><em class="when-playing">STOP</em></span>
          </div>
          <div class="key">
            <button id="next" data-action="next" title="Следующий">
              <svg viewBox="0 0 10 10"><path d="M7.1 1.5h1.3v7H7.1zM1.4 1.5v7L6.8 5z" /></svg>
            </button>
            <span>NEXT</span>
          </div>
        </div>
      </div>

      <div class="lamp"></div>
      <div class="armbase"></div>
      <div class="armrest"></div>
      <div class="tonearm" id="tonearm">
        <svg class="arm" viewBox="-30 -50 60 210" width="60" height="210">
          <defs>
            <linearGradient id="chrome" x1="0" x2="1">
              <stop offset="0" stop-color="#9a9e9a" />
              <stop offset="0.45" stop-color="#f5f6f2" />
              <stop offset="1" stop-color="#8c908c" />
            </linearGradient>
            <linearGradient id="graphite" x1="0" x2="1">
              <stop offset="0" stop-color="#262b2a" />
              <stop offset="0.5" stop-color="#575e5c" />
              <stop offset="1" stop-color="#262b2a" />
            </linearGradient>
          </defs>

          <g class="arm-braun">
            <rect x="-6" y="-24" width="12" height="13" rx="3" fill="url(#graphite)" />
            <rect x="-1.5" y="-12" width="3" height="134" rx="1.5" fill="url(#chrome)" />
            <rect x="-5" y="117" width="10" height="25" rx="2" fill="url(#graphite)" />
          </g>

          <g class="arm-s">
            <rect x="-2.2" y="-22" width="4.4" height="22" fill="url(#chrome)" />
            <rect x="-8" y="-44" width="16" height="22" rx="2.5" fill="url(#chrome)" />
            <rect x="-8" y="-27" width="16" height="4" fill="#161616" />
            <path class="tube" d="M0,0 L0,66 C0,84 -6,90 -6,100 C-6,110 4,112 8.2,117.4" />
            <path class="tube-light" d="M0,0 L0,66 C0,84 -6,90 -6,100 C-6,110 4,112 8.2,117.4" />
            <g transform="rotate(20 0 140)">
              <rect x="6" y="120" width="8" height="1.8" rx="0.9" fill="#c9ccc8" />
              <rect x="-6" y="116" width="12" height="26" rx="1.5" fill="#1b1b1b" />
              <circle cx="-2.5" cy="127" r="0.9" fill="#b9bcb8" />
              <circle cx="2.5" cy="127" r="0.9" fill="#b9bcb8" />
              <rect x="-3" y="134" width="6" height="5" rx="0.8" fill="#2d2d2d" />
            </g>
          </g>

          <g class="arm-studio">
            <rect x="-4.5" y="-9" width="9" height="11" rx="1.5" fill="url(#graphite)" />
            <rect x="-9" y="-22" width="18" height="14" rx="2" fill="url(#chrome)" />
            <rect x="-6.5" y="-19.5" width="13" height="7" rx="1" fill="#1b1b1b" />
            <path class="tube" d="M0,0 L10.5,124" />
            <path class="tube-light" d="M0,0 L10.5,124" />
            <g transform="rotate(22 0 150)">
              <rect x="-7" y="121" width="14" height="31" rx="1.5" fill="#1c1c1c" />
              <rect x="-7" y="121" width="14" height="4" rx="1" fill="url(#chrome)" />
              <path d="M7,129 l9,-3.5 v2.6 l-9,3.5 z" fill="url(#chrome)" />
              <rect x="-4" y="141" width="8" height="7" rx="1" fill="#2c2c2c" />
            </g>
          </g>

          <g class="arm-dual">
            <rect x="-7" y="-40" width="14" height="20" rx="6" fill="url(#chrome)" />
            <path class="tube" d="M0,-20 L0,105 L6.6,117" />
            <path class="tube-light" d="M0,-20 L0,105 L6.6,117" />
            <g transform="rotate(16 0 140)">
              <rect x="-5.5" y="116" width="11" height="26" rx="2" fill="#262626" />
              <rect x="5.5" y="121" width="6" height="1.6" rx="0.8" fill="#d8d3c6" />
            </g>
          </g>
        </svg>
      </div>
      <div class="pivot"></div>
    </div>
    </div>
  </body>
</html>
